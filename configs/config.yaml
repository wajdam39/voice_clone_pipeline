downloader:
  output_dir: "data/raw"
  audio_format: "wav"
  sample_rate: 22050

preprocessing:
  target_sample_rate: 22050
  n_fft: 1024
  hop_length: 256
  win_length: 1024
  n_mels: 80
  f_min: 0
  f_max: 8000

segmentation:
  segment_length: 512
  hop: 256

model:
  base_channels: 32
  channel_multipliers: [1, 2, 4]
  time_emb_dim: 128
  num_res_blocks: 2

diffusion:
  num_timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02

train:
  batch_size: 16
  learning_rate: 0.0001
  num_epochs: 100
  checkpoint_dir: "checkpoints"
  log_dir: "logs"

vocoder:
  type: "hifigan"
  # Pretrained HiFi-GAN (SpeechBrain, Hugging Face Hub), trained on a mel
  # recipe matching preprocessing.spectrogram.audio_to_melspectrogram exactly
  # (sr=22050, n_fft=1024, hop=256, win=1024, n_mels=80, fmin=0, fmax=8000).
  source: "speechbrain/tts-hifigan-ljspeech"
  savedir: "pretrained_models/tts-hifigan-ljspeech"
