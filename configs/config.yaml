downloader:
  output_dir: data/raw
  audio_format: wav
  sample_rate: 22050
  # Netscape-format cookies file passed to yt-dlp (authenticates requests as
  # a logged-in browser session, helping avoid bot-detection/age/region
  # errors). Silently ignored if the file doesn't exist.
  cookies_file: youtube.com_cookies.txt
  # External JS runtime yt-dlp uses to solve YouTube's JS challenge (EJS).
  # Required to avoid download failures/blocks from datacenter/cloud IPs
  # (e.g. AWS EC2). "node" is used instead of yt-dlp's own default ("deno")
  # since Node.js is more commonly pre-installed/available on EC2 images.
  js_runtime: node
  # Lets yt-dlp fetch the EJS challenge-solver scripts from GitHub on demand
  # so js_runtime above has something to execute.
  remote_components:
  - ejs:github
  # Random delay (seconds) yt-dlp waits before each download, uniformly
  # chosen between sleep_interval and max_sleep_interval. Spaces out
  # requests so traffic looks less automated, reducing the odds of
  # YouTube's rate-limiting/bot-detection -- especially important when
  # downloading many videos back-to-back from one (likely datacenter) IP.
  sleep_interval: 5
  max_sleep_interval: 15
  # YouTube player client(s) yt-dlp impersonates (extractor_args -> youtube
  # -> player_client). Mobile/TV clients ("ios", "tv_embedded") historically
  # don't require solving YouTube's JS challenge at all and are less likely
  # to be blocked from datacenter/cloud IPs (e.g. AWS EC2), complementing
  # (not replacing) cookies_file/js_runtime/remote_components above.
  player_clients:
  - ios
  - tv_embedded

preprocessing:
  target_sample_rate: 22050
  n_fft: 1024
  hop_length: 256
  win_length: 1024
  n_mels: 80
  f_min: 0
  f_max: 8000

segmentation:
  segment_length: 512
  hop: 256

model:
  base_channels: 32
  channel_multipliers:
  - 1
  - 2
  - 4
  time_emb_dim: 128
  num_res_blocks: 2

diffusion:
  num_timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02

train:
  batch_size: 16
  learning_rate: 0.0001
  num_epochs: 1
  checkpoint_dir: checkpoints
  log_dir: logs
  wandb:
    # Set to false to disable W&B logging entirely (training still runs
    # normally, metrics are only printed to stdout). Automatically disabled
    # (with a warning) if the optional `wandb` package isn't installed.
    enabled: true
    project: voice-clone-diffusion
    entity:
    run_name:
    # "online" (default), "offline" (log locally, no network required) or
    # "disabled" (no-op, same as enabled: false).
    mode:

vocoder:
  type: hifigan
  # Pretrained HiFi-GAN (SpeechBrain, Hugging Face Hub), trained on a mel
  # recipe matching preprocessing.spectrogram.audio_to_melspectrogram exactly
  # (sr=22050, n_fft=1024, hop=256, win=1024, n_mels=80, fmin=0, fmax=8000).
  source: speechbrain/tts-hifigan-ljspeech
  savedir: pretrained_models/tts-hifigan-ljspeech
